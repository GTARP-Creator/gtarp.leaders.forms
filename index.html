<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GTARP | Заявка на лидера Ghetto</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: #0d0d0d;
      color: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 2rem 1.5rem;
      background-image: radial-gradient(circle at 10% 20%, rgba(255, 140, 0, 0.05) 0%, transparent 50%);
    }

    .app {
      max-width: 820px;
      width: 100%;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #ff8c00;
      margin-bottom: 2rem;
      text-shadow: 0 0 30px rgba(255, 140, 0, 0.2);
    }

    .brand span {
      background: #1a1a1a;
      padding: 0.2rem 1.2rem;
      border-radius: 40px;
      font-size: 1.0rem;
      font-weight: 600;
      color: #fff;
      border: 1px solid #ff8c00;
      letter-spacing: 0.5px;
    }

    .hero {
      background: linear-gradient(145deg, #1a1a1a, #141414);
      border-radius: 24px;
      padding: 2.5rem 2.8rem;
      border-left: 8px solid #ff8c00;
      margin-bottom: 2.5rem;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 140, 0, 0.1);
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: '👑';
      position: absolute;
      right: -10px;
      top: -10px;
      font-size: 8rem;
      opacity: 0.04;
      transform: rotate(15deg);
    }

    .hero h1 {
      font-size: 2.6rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 0.4rem;
      background: linear-gradient(135deg, #fff 60%, #ff8c00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero p {
      color: #b0b0b0;
      font-size: 1.05rem;
    }

    .hero p span {
      -webkit-text-fill-color: #ff8c00;
      font-weight: 600;
    }

    .form-card {
      background: #161616;
      border-radius: 20px;
      padding: 1.8rem 2.2rem;
      border: 1px solid #2a2a2a;
      margin-bottom: 1.5rem;
      transition: all 0.3s ease;
    }

    .form-card:hover {
      border-color: #ff8c00;
      box-shadow: 0 0 0 1px rgba(255, 140, 0, 0.15), 0 8px 25px rgba(0, 0, 0, 0.3);
      transform: translateY(-2px);
    }

    .form-card label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #d0d0d0;
      margin-bottom: 0.7rem;
    }

    .form-card label .required {
      color: #ff6b4a;
      font-size: 1.3rem;
      line-height: 1;
    }

    .form-card input,
    .form-card textarea {
      width: 100%;
      padding: 0.9rem 1.2rem;
      background: #0a0a0a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: all 0.3s ease;
    }

    .form-card input:focus,
    .form-card textarea:focus {
      border-color: #ff8c00;
      background: #101010;
      box-shadow: 0 0 0 4px rgba(255, 140, 0, 0.1);
    }

    .form-card input::placeholder,
    .form-card textarea::placeholder {
      color: #4a4a4a;
      font-weight: 300;
    }

    .form-card textarea {
      resize: vertical;
      min-height: 110px;
    }

    .btn-submit {
      width: 100%;
      padding: 1.2rem;
      border: none;
      border-radius: 40px;
      background: linear-gradient(145deg, #ff8c00, #e67600);
      color: #fff;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 6px 25px rgba(255, 140, 0, 0.3);
      margin-top: 0.5rem;
      position: relative;
      overflow: hidden;
    }

    .btn-submit::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .btn-submit:hover::before {
      opacity: 1;
    }

    .btn-submit:hover {
      transform: scale(1.02);
      background: #ff9e20;
      box-shadow: 0 8px 35px rgba(255, 140, 0, 0.5);
    }

    .btn-submit:active {
      transform: scale(0.98);
    }

    .notification {
      display: none;
      position: fixed;
      top: 20px;
      right: 20px;
      background: #1a1a1a;
      border: 1px solid #ff8c00;
      border-radius: 16px;
      padding: 1.5rem 2rem;
      max-width: 400px;
      z-index: 1000;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
      animation: slideIn 0.5s ease;
    }

    .notification.show {
      display: block;
    }

    .notification.success {
      border-left: 6px solid #00c853;
    }

    .notification.error {
      border-left: 6px solid #d50000;
    }

    .notification h3 {
      color: #fff;
      margin-bottom: 0.5rem;
      font-size: 1.1rem;
    }

    .notification p {
      color: #aaa;
      font-size: 0.95rem;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(100px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @media (max-width: 600px) {
      body { padding: 1rem; }
      .hero { padding: 1.5rem; }
      .hero h1 { font-size: 2rem; }
      .hero::before { font-size: 5rem; }
      .form-card { padding: 1.2rem 1.2rem; }
      .brand { font-size: 1.4rem; }
      .notification {
        top: 10px;
        right: 10px;
        left: 10px;
        max-width: none;
        padding: 1rem 1.2rem;
      }
    }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #1a1a1a; }
    ::-webkit-scrollbar-thumb { background: #ff8c00; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #ffa733; }
  </style>
</head>
<body>

<div class="app">

  <div class="brand">
    ⭐ <span>GTARP</span>
  </div>

  <div class="hero">
    <h1>Заявка на пост Лидера Ghetto</h1>
    <p>Заполните все обязательные поля. <span>*</span> — обязательно для заполнения</p>
  </div>

  <form id="mediaForm">

    <div class="form-card">
      <label><span class="required">*</span> Ваш игровой ник</label>
      <input type="text" required placeholder="Введите ваш игровой ник" id="nickname" />
    </div>

    <div class="form-card">
      <label><span class="required">*</span> Ваше настоящее имя</label>
      <input type="text" required placeholder="Введите ваше настоящее имя" id="realname" />
    </div>

    <div class="form-card">
      <label><span class="required">*</span> Ваш возраст</label>
      <input type="number" required placeholder="Ваш возраст" id="age" min="14" max="99" />
    </div>

    <div class="form-card">
      <label><span class="required">*</span> Discord (никнейм#тег)</label>
      <input type="text" required placeholder="Пример: user#1234" id="discord" />
    </div>

    <div class="form-card">
      <label><span class="required">*</span> Ваш часовой пояс</label>
      <input type="text" required placeholder="Пример: UTC+3" id="timezone" />
    </div>

    <div class="form-card">
      <label><span class="required">*</span> Были ли вы на высоких должностях?</label>
      <input type="text" required placeholder="Да / Нет (если да, укажите какие)" id="experience" />
    </div>

    <div class="form-card">
      <label><span class="required">*</span> Есть ли у вас состав?</label>
      <input type="text" required placeholder="Да / Нет (если да, укажите примерное количество и описание)" id="hasTeam" />
    </div>

    <div class="form-card">
      <label>Почему именно вы должны стать лидером?</label>
      <textarea rows="6" placeholder="Опишите ваш опыт, лидерские качества и видение развития" id="reason"></textarea>
    </div>

    <button type="submit" class="btn-submit">👑 Отправить заявку</button>
  </form>

  <div id="notification" class="notification">
    <h3 id="notifTitle">✅ Успешно!</h3>
    <p id="notifMessage">Заявка отправлена в Telegram</p>
  </div>

</div>

<script>
  (function() {
    const form = document.getElementById('mediaForm');
    const nickname = document.getElementById('nickname');
    const realname = document.getElementById('realname');
    const age = document.getElementById('age');
    const discord = document.getElementById('discord');
    const timezone = document.getElementById('timezone');
    const experience = document.getElementById('experience');
    const hasTeam = document.getElementById('hasTeam');
    const reason = document.getElementById('reason');
    const notification = document.getElementById('notification');
    const notifTitle = document.getElementById('notifTitle');
    const notifMessage = document.getElementById('notifMessage');

    const BOT_TOKEN = '8232289129:AAFAl_HbhYGeIpYTqmwyC_PFXiURsatvVQg';
    const CHAT_ID = '1156219743';

    function showNotification(title, message, type = 'success') {
      notifTitle.textContent = title;
      notifMessage.textContent = message;
      notification.className = 'notification show ' + type;
      
      clearTimeout(window.notifTimeout);
      window.notifTimeout = setTimeout(() => {
        notification.classList.remove('show');
      }, 5000);
    }

    async function sendToTelegram(formData) {
      const message = `
👑 **Новая заявка на Лидера Ghetto**

🎮 **Игровой ник:** ${formData.nickname}
👤 **Настоящее имя:** ${formData.realname}
📅 **Возраст:** ${formData.age} лет
💬 **Discord:** ${formData.discord}
🌍 **Часовой пояс:** ${formData.timezone}
💼 **Высокие должности:** ${formData.experience}
👥 **Наличие состава:** ${formData.hasTeam}

✍️ **Почему именно вы?**
${formData.reason}

📅 **Дата подачи:** ${new Date().toLocaleString('ru-RU')}
      `;

      const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;

      try {
        const response = await fetch(url, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            chat_id: CHAT_ID,
            text: message,
            parse_mode: 'Markdown',
            disable_web_page_preview: true
          })
        });

        const data = await response.json();

        if (data.ok) {
          console.log('✅ Заявка отправлена в Telegram');
          return true;
        } else {
          console.error('❌ Ошибка Telegram API:', data);
          throw new Error(data.description || 'Ошибка отправки');
        }
      } catch (error) {
        console.error('❌ Ошибка:', error);
        throw error;
      }
    }

    form.addEventListener('submit', async function(e) {
      e.preventDefault();

      const requiredFields = [nickname, realname, age, discord, timezone, experience, hasTeam];
      for (let field of requiredFields) {
        if (!field.value.trim()) {
          showNotification(
            '⚠️ Ошибка!',
            'Пожалуйста, заполните все обязательные поля (отмечены *).',
            'error'
          );
          field.focus();
          return;
        }
      }

      const formData = {
        nickname: nickname.value.trim(),
        realname: realname.value.trim(),
        age: age.value,
        discord: discord.value.trim(),
        timezone: timezone.value.trim(),
        experience: experience.value.trim(),
        hasTeam: hasTeam.value.trim(),
        reason: reason.value.trim() || 'Не указано'
      };

      showNotification(
        '⏳ Отправка...',
        'Ваша заявка отправляется в Telegram',
        'success'
      );

      try {
        await sendToTelegram(formData);
        
        showNotification(
          '✅ Заявка отправлена!',
          'Ваша заявка успешно отправлена в Telegram. Ожидайте решения администрации.',
          'success'
        );

        form.reset();

      } catch (error) {
        showNotification(
          '❌ Ошибка!',
          'Не удалось отправить заявку. Попробуйте позже или свяжитесь с администрацией.',
          'error'
        );
      }
    });

    console.log('✅ Бот настроен!');
  })();
</script>

</body>
</html>
